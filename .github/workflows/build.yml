name: Build

# 每次 push 到主分支、以及所有 PR 都跑一遍：单元测试 + lint + 构建。
# 也支持在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

# 同一分支连续提交时，取消还没跑完的上一次，省时间也省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 只读仓库内容，不给多余权限
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradlew 是在 Windows 上提交的，权限位是 644。
      # 不补这一下，Linux runner 上会报 "Permission denied"。
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 项目要求 JDK 17~21（AGP 9.4.0 / Gradle 9.7.1），这里固定用 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 不引 android-actions/setup-android：ubuntu runner 镜像自带 Android SDK
      # 和 cmdline-tools，多一个 action 就多一个失败点（前两次都是它挂的）。
      # 包名是 platforms;android-37.0 —— Android 现在用「主版本.次版本」编号
      # （36.0 / 37.0），少写 .0 会被判定为包不存在。
      - name: Install SDK platform 37.0
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          echo "使用 $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
          echo "--- SDK 里现有的 platforms ---"
          ls "$ANDROID_SDK_ROOT/platforms"

      # 37 个纯逻辑单元测试：协议编解码、TCP 分帧、组网路由、拨号判定反对称性
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # lint 目前是 0 error / 27 warning。它以前抓到过一个真实的 BLE 逻辑错误，
      # 所以留在 CI 里 —— 一旦出现 error 就会红。
      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      # 测试挂了也能下载报告看是哪个用例
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      # 构建出来的包直接可以从 Actions 页面下载，不用自己编译
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
